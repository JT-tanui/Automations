<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Bee Certificate</title>
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }
    
    .certificate-container {
      width: 800px;
      height: 600px;
      position: relative;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    
    .certificate-bg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-image: url('C:/Users/HP/Documents/Projetcs/Cert_gen/Assets/Sp_Cert.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    /* Title overlay - moved down further */
    .title-overlay {
      position: absolute;
      top: 115px;  /* Was 95px, moved down 20px */
      left: 0;
      width: 100%;
      text-align: center;
    }
    
    .title-text {
      background: transparent;
      border: none;
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      width: 80%;
      letter-spacing: 2px;
      display: none;
    }
    
    /* Subtitle overlay - moved down further */
    .subtitle-overlay {
      position: absolute;
      top: 165px;  /* Was 145px, moved down 20px */
      left: 0;
      width: 100%;
      text-align: center;
    }
    
    .subtitle-text {
      background: transparent;
      border: none;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      width: 60%;
      color: white;
      display: none;
    }
    
    /* Description overlay - moved down further */
    .description-overlay {
      position: absolute;
      top: 265px;  /* Was 245px, moved down 20px */
      left: 0;
      width: 100%;
      text-align: center;
    }
    
    .description-text {
      background: transparent;
      border: none;
      font-size: 18px;
      text-align: center;
      width: 80%;
      display: none;
    }
    
    /* Name field - moved down further */
    .name-overlay {
      position: absolute;
      top: 300px;  /* Was 295px, moved down 20px */
      left: 0;
      width: 100%;
      text-align: center;
    }
    
    .name-field {
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      font-size: 40px;
      text-align: center;
      width: 70%;
      /* display: block; Ensure this stays visible */
    }
    
    /* Achievement text - moved down further */
    .achievement-overlay {
      position: absolute;
      top: 375px;  /* Was 355px, moved down 20px */
      left: 0;
      width: 100%;
      text-align: center;
    }
    
    .achievement-text {
      background: transparent;
      border: none;
      font-size: 16px;
      text-align: center;
      width: 80%;
      display: none;
    }
    
    /* School field - moved up less from bottom (which means down) */
    .school-overlay {
      position: absolute;
      bottom: 45px;  /* Was 65px, moved down 20px */
      left: 15%;
      width: 30%;
      text-align: center;
    }
    
    .school-field {
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      font-size: 16px;
      text-align: center;
      width: 100%;
      display: none;
    }
    
    .school-label {
      font-size: 14px;
      margin-top: 5px;
      text-align: center;
    }
    
    /* Signature field - moved up less from bottom (which means down) */
    .signature-overlay {
      position: absolute;
      bottom: 45px;  /* Was 65px, moved down 20px */
      right: 15%;
      width: 30%;
      text-align: center;
    }
    
    .signature-field {
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      font-size: 16px;
      text-align: center;
      width: 100%;
      display: none;
    }
    
    .signature-label {
      font-size: 14px;
      margin-top: 5px;
      text-align: center;
    }
    
    /* Make input fields show their borders only on focus or hover */
    input {
      outline: none;
    }
    
    input:hover, input:focus {
      border-bottom: 1px dashed #999;
    }
    
    /* Instructions for the user */
    .instructions {
      margin-top: 20px;
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 800px;
    }
    
    h3 {
      margin-top: 0;
      color: #333;
    }
    
    ul {
      padding-left: 20px;
    }
    
    li {
      margin-bottom: 8px;
    }
    
    .note {
      font-style: italic;
      color: #666;
    }
    
    /* Add styles for new hidden fields */
    .date-field, .cert-number {
      display: none;
    }
  </style>
</head>
<body>
  <div>
    <div class="certificate-container">
      <!-- In a real implementation, replace this with the actual certificate image -->
      <div class="certificate-bg"></div>
      
      <!-- Overlay with editable fields positioned exactly over the original text -->
      <div class="overlay">
        <!-- Title (SPELLING BEE) -->
        <div class="title-overlay">
          <input type="text" class="title-text" value="SPELLING BEE">
        </div>
        
        <!-- Subtitle (CLASSROOM CHAMPION) -->
        <div class="subtitle-overlay">
          <input type="text" class="subtitle-text" value="[Award Type]">
        </div>
        
        <!-- Description text (This certificate is presented to) -->
        <div class="description-overlay">
          <input type="text" class="description-text" value="This certificate is presented to">
        </div>
        
        <!-- Name field (line for recipient name) -->
        <div class="name-overlay">
          <input type="text" class="name-field" value="[Student Name]">
        </div>
        
        <!-- Achievement text (for being the top speller...) -->
        <div class="achievement-overlay">
          <input type="text" class="achievement-text" value="[Award Type]">
        </div>
        
        <!-- School field -->
        <div class="school-overlay">
          <input type="text" class="school-field" value="[Position]">
          <div class="school-label"></div>
        </div>
        
        <!-- Signature field -->
        <div class="signature-overlay">
          <input type="text" class="signature-field" value="[Signatory Name]">
          <div class="signature-label"></div>
        </div>
        
        <!-- Hidden date field -->
        <div style="display:none">
          <input type="text" class="date-field" value="[Date]">
        </div>
        
        <!-- Hidden certificate number -->
        <div style="display:none">
          <input type="text" class="cert-number" value="SIS-2024-[XXXX]">
        </div>
      </div>
    </div>

</body>
